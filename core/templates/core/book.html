<!DOCTYPE html>
<html>
<head><title>Book with {{ business.name }}</title></head>
<body>
  <h2>Book an Appointment with {{ business.name }}</h2>
  {% if messages %}
    {% for msg in messages %}<p style="color:red">{{ msg }}</p>{% endfor %}
  {% endif %}
  <form method="POST">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Your Full Name" required><br><br>
    <input type="text" name="phone" placeholder="Phone (e.g. 2348012345678)" required><br><br>
    <input type="date" name="date" required><br><br>
    <input type="time" name="time" required><br><br>
    <button type="submit">Confirm Booking</button>
  </form>
</body>
</html>

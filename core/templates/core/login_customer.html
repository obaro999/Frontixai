<!DOCTYPE html>
<html>
<head><title>{{business.business_name}}</title></head>
<body style="font-family:Arial;text-align:center;padding:50px;background:#0a0a1a;color:white">
<h2>{{business.business_name}}</h2>
<form method="GET" style="display:inline-block;text-align:left">
{% csrf_token %}
<p><input name="name" placeholder="Your Name" style="padding:10px;width:300px;border-radius:6px;border:none"><br><br>
<input name="phone" placeholder="Your Phone Number" style="padding:10px;width:300px;border-radius:6px;border:none"><br><br>
<button type="submit" style="background:#00ff88;color:black;padding:12px 30px;border:none;border-radius:6px;width:322px;font-size:16px">Continue</button></p>
</form>
</body>
</html>

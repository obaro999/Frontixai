<!DOCTYPE html>
<html>
<head><title>Payment - {{business.business_name}}</title></head>
<body style="font-family:Arial;text-align:center;padding:50px;background:#0a0a1a;color:white">
<h2>Payment Info</h2>
<h3>{{business.business_name}}</h3>
{% if config %}
<div style="background:#1a1a2e;padding:30px;border-radius:10px;display:inline-block;text-align:left">
<p><strong>Bank:</strong> {{config.bank_name}}</p>
<p><strong>Account Number:</strong> {{config.account_number}}</p>
<p><strong>Account Name:</strong> {{config.account_name}}</p>
<p><strong>Support:</strong> {{config.support_phone}}</p>
</div>
{% else %}
<p>Contact admin to set up payment info.</p>
{% endif %}
<br><br>
<a href="/{{request.resolver_match.kwargs.username}}/appointments/?phone={{request.GET.phone}}" style="color:#00ff88">View My Appointments</a>
</body>
</html>

<!DOCTYPE html>
<html>
<head><title>Dashboard - Frontix AI</title></head>
<body style="font-family:Arial;padding:30px;background:#0a0a1a;color:white">
<h2>{{business.name}} Dashboard</h2>
<p>Plan: {{business.plan}} | <a href="/setup-payment/" style="color:#00ff88">Setup Payment</a> | <a href="/logout/" style="color:red">Logout</a></p>
<p>Your booking link: <strong>https://{{request.get_host}}/{{request.user.username}}/</strong></p>
<h3>Recent Bookings</h3>
{% for a in appointments %}
<div style="background:#1a1a2e;padding:15px;margin:10px 0;border-radius:8px">
<p>{{a.name}} | {{a.phone}} | {{a.date}} at {{a.time}}</p>
</div>
{% empty %}
<p>No bookings yet.</p>
{% endfor %}
</body>
</html>

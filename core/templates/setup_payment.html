<!DOCTYPE html>
<html>
<head><title>Update Payment Info</title></head>
<body>
  <h2>Update Payment Info for {{ business.name }}</h2>
  {% if messages %}
    {% for msg in messages %}<p style="color:green">{{ msg }}</p>{% endfor %}
  {% endif %}
  <form method="POST">
    {% csrf_token %}
    <textarea name="payment_info" rows="6" cols="40"
      placeholder="Enter your bank details, mobile money, etc.">{{ config.payment_info }}</textarea><br><br>
    <button type="submit">Save</button>
  </form>
  <p><a href="{% url 'dashboard' %}">Back to Dashboard</a></p>
</body>
</html>

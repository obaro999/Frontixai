<!DOCTYPE html>
<html>
<head>
<title>Book Appointment</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial; background: #0a0a1a; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { width: 360px; padding: 40px 20px; }
h2 { text-align: center; margin-bottom: 30px; font-size: 22px; }
label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
select, input { width: 100%; padding: 12px; border-radius: 6px; border: none; margin-bottom: 20px; font-size: 15px; background: #1a1a2e; color: white; }
button { width: 100%; padding: 14px; background: #00ff88; color: black; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <h2>Book with {{ business.business_name }}</h2>
  <form method="POST">
    {% csrf_token %}
    <label>Service</label>
    <select name="service">
      {% for service in services %}
      <option value="{{ service.id }}">{{ service.name }} - ${{ service.price }}</option>
      {% endfor %}
    </select>
    <label>Date</label>
    <input type="date" name="date" required>
    <label>Time</label>
    <input type="time" name="time" required>
    <button type="submit">Continue to Payment</button>
  </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Payment</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial; background: #0a0a1a; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { width: 360px; padding: 40px 20px; }
h2 { text-align: center; margin-bottom: 10px; }
.summary { background: #1a1a2e; border-radius: 8px; padding: 20px; margin-bottom: 25px; }
.summary p { margin-bottom: 8px; font-size: 14px; color: #aaa; }
.summary span { color: white; font-weight: bold; }
.total { font-size: 20px; color: #00ff88; margin-top: 10px; }
button { width: 100%; padding: 14px; background: #00ff88; color: black; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <h2>Confirm & Pay</h2>
  <div class="summary">
    <p>Service: <span>{{ appointment.service.name }}</span></p>
    <p>Date: <span>{{ appointment.date }}</span></p>
    <p>Time: <span>{{ appointment.time }}</span></p>
    <p class="total">Total: ${{ appointment.service.price }}</p>
  </div>
  <form method="POST">
    {% csrf_token %}
    <button type="submit">Pay Now</button>
  </form>
</div>
</body>
</html>

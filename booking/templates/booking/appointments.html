<!DOCTYPE html>
<html>
<head>
<title>My Appointments</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial; background: #0a0a1a; color: white; min-height: 100vh; padding: 40px 20px; }
h2 { text-align: center; margin-bottom: 25px; }
.card { background: #1a1a2e; border-radius: 8px; padding: 18px; margin-bottom: 15px; }
.card p { font-size: 14px; color: #aaa; margin-bottom: 6px; }
.card span { color: white; font-weight: bold; }
.status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
.paid { background: #00ff8833; color: #00ff88; }
.pending { background: #ff880033; color: #ff8800; }
.empty { text-align: center; color: #aaa; margin-top: 60px; }
</style>
</head>
<body>
<h2>My Appointments</h2>
{% if appointments %}
  {% for apt in appointments %}
  <div class="card">
    <p>Service: <span>{{ apt.service.name }}</span></p>
    <p>Date: <span>{{ apt.date }}</span></p>
    <p>Time: <span>{{ apt.time }}</span></p>
    <p>Status: <span class="status {% if apt.paid %}paid{% else %}pending{% endif %}">
      {% if apt.paid %}Paid{% else %}Pending{% endif %}
    </span></p>
  </div>
  {% endfor %}
{% else %}
  <p class="empty">No appointments yet.</p>
{% endif %}
</body>
</html>
